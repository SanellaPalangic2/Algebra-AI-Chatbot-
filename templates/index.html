<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algebra Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <button class="logo" id="logo" aria-label="Go to quest map"><span class="logo-bot">🤖</span> Algebra Quest</button>
    <div class="topbar-right">
      <span class="xp" id="xp" title="Levels mastered">⭐ 0</span>
      <button class="reset" id="reset" title="Start over from Level 1">↺ Reset</button>
    </div>
  </header>

  <div class="layout">
    <main id="view" aria-live="polite"></main>

    <aside class="chat-panel" id="chat-panel" aria-label="Chat with Algebot">
      <div class="chat-head">
        <div class="chat-avatar">🤖</div>
        <div class="chat-title">
          <div class="chat-name">Algebot</div>
          <div class="chat-context" id="chat-context">Ask me anything about algebra!</div>
        </div>
        <button class="chat-close" id="chat-close" aria-label="Close chat">✕</button>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="chips" id="chips">
        <button type="button">Explain it simpler 🐣</button>
        <button type="button">Show me an example ✏️</button>
        <button type="button">Why does that work? 🤔</button>
      </div>
      <form class="chat-form" id="chat-form">
        <input id="chat-input" maxlength="500" autocomplete="off" placeholder="Ask Algebot a question…" aria-label="Message Algebot">
        <button type="submit" aria-label="Send">➤</button>
      </form>
    </aside>
  </div>

  <button class="chat-toggle" id="chat-toggle" aria-label="Open chat with Algebot">🤖 Ask Algebot</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
